[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanspace"
version = "0.1.0"
description = "A transparent, conservative Windows cleanup utility."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.7,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
